name: Simple Clipboard
options:
  deploymentTarget:
    macOS: "26.0"
  bundleIdPrefix: com.simpleclipboard
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  Simple Clipboard:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: "Simple Clipboard"
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: "Simple Clipboard/Info.plist"
      properties:
        LSUIElement: true
        CFBundleName: "Simple Clipboard"
        CFBundleDisplayName: "Simple Clipboard"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: "en"
        CFBundleLocalizations:
          - "en"
          - "es"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simpleclipboard.app
        PRODUCT_NAME: "Simple Clipboard"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
